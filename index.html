<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>NFC Sound</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #111827; color: #f9fafb; }
    main { padding: 32px; text-align: center; }
    h1 { font-size: 32px; }
    p { color: #cbd5e1; }
  </style>
</head>
<body>
  <main>
    <h1>NFC Sound</h1>
    <p id="status" role="status" aria-live="polite">Запуск звука…</p>
    <audio id="audio" src="sound.mp3" autoplay preload="auto"></audio>
  </main>
  <script>
    const audio = document.getElementById('audio');
    const status = document.getElementById('status');
    audio.muted = false;
    audio.volume = 1;

    audio.play().then(() => {
      status.textContent = 'Звук воспроизводится';
    }).catch((error) => {
      status.textContent = error.name === 'NotAllowedError'
        ? 'Браузер заблокировал автоматический запуск звука.'
        : 'Не удалось загрузить звук. Проверьте подключение к интернету.';
    });

    audio.addEventListener('ended', () => {
      status.textContent = 'Воспроизведение завершено';
    });
  </script>
</body>
</html>
